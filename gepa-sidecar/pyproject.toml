[project]
name = "freerouter-gepa-sidecar"
version = "0.1.0"
description = "Offline + per-request GEPA optimization sidecar for FreeRouter"
requires-python = ">=3.10,<3.15"
dependencies = [
  "gepa>=0.1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "anthropic>=0.34",       # judge LM client (optional in mock mode)
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
